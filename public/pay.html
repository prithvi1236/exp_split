<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pay your share</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    main { padding: 40px 16px; display: grid; gap: 14px; align-content: start; }
    .grand .to { font-size: 18px; font-weight: 650; margin-top: 2px; }
  </style>
</head>
<body>
  <!-- Opened from a "Pay via UPI" link in a chat: chat apps don't let upi:// links be tapped, a web page can. -->
  <main id="view"><p class="lead">This payment link is incomplete.</p></main>
  <script type="module">
    import * as UPI from './upi.js';
    const q = new URLSearchParams(location.search), pa = (q.get('pa') || '').trim(), pn = (q.get('pn') || pa).slice(0, 40);
    const am = Math.round(Number(q.get('am')) * 100), c = Number.isFinite(am) && am > 0 && am < 1e11 ? am : 0;
    const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const fmt = (n) => '₹' + (n / 100).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (UPI.VPA.test(pa)) {
      const to = { pa, pn }, note = (q.get('tn') || '').slice(0, 50) || undefined;
      document.getElementById('view').innerHTML = `
        <div class="grand"><div class="muted small">${c ? 'Your share' : 'Pay'}</div>${c ? `<div class="big">${fmt(c)}</div>` : ''}
          <div class="to">to ${esc(pn)}</div></div>
        <div class="pay"><a class="btn primary block" href="${esc(UPI.link(to, c, undefined, note))}">Open UPI app</a>${UPI.appButtons(to, c, note)}
          <p class="muted small">${esc(pa)} · <button class="link" id="copy">Copy UPI ID</button></p></div>`;
      document.getElementById('copy').onclick = async (e) => {
        try { await navigator.clipboard.writeText(pa); e.target.textContent = 'Copied'; } catch { e.target.textContent = pa; }
      };
    }
  </script>
</body>
</html>
